<!doctype html>
<html lang="en">
  <head>

    <title>Abhishek R P · Interactive star map</title>
    <style>/* SPDX-License-Identifier: GPL-3.0-only */
:root {
  color-scheme: dark light;
  --page: #0d1117;
  --text: #f0f0f0;
  --muted: #a0a0a0;
  --star: #fff;
  --panel: #101010;
  --border: #444;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 40px 24px;
  color: var(--text);
  background: var(--page);
  font:
    16px/1.5 system-ui,
    sans-serif;
}
main {
  width: min(1100px, 100%);
  margin: auto;
}
.star-map {
  position: relative;
}
.star-map img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 14px;
}
.project-target {
  position: absolute;
  left: var(--x);
  top: var(--y);
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  transform: translate(-50%, -50%);
  cursor: pointer;
}
.project-star {
  display: block;
  position: absolute;
  left: 50%;
  top: 50%;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--star);
  box-shadow: 0 0 8px 2px var(--star);
  transform: translate(-50%, -50%);
  transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1);
}
.project-star::before,
.project-star::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  background: var(--star);
  transform: translate(-50%, -50%);
}
.project-star::before {
  width: 1px;
  height: 15px;
}
.project-star::after {
  width: 15px;
  height: 1px;
}
.project-target::before {
  content: "";
  position: absolute;
  inset: 9px;
  border: 1px solid var(--star);
  border-radius: 50%;
  opacity: 0.42;
}
.project-fallback {
  display: none;
}
.star-map:not(.interactive-ready) .project-target:hover .project-fallback,
.star-map:not(.interactive-ready) .project-target:focus .project-fallback {
  display: block;
  position: absolute;
  z-index: 3;
  right: 0;
  bottom: 48px;
  width: 210px;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  color: var(--text);
  font:
    14px/1.5 system-ui,
    sans-serif;
  text-align: left;
}
.project-fallback strong {
  display: block;
  margin-bottom: 6px;
}
.project-fallback span {
  display: block;
  color: var(--muted);
}
.project-target:focus-visible,
.project-target[aria-expanded="true"] {
  outline: 1px solid var(--star);
  outline-offset: -7px;
}
@media (prefers-reduced-motion: no-preference) {
  .project-target {
    animation: targets-in 0.75s ease-out 6.3s both;
  }
  @keyframes targets-in {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }
}
.project-target:active .project-star {
  transform: translate(-50%, -50%) scale(0.97);
}
@media (hover: hover) and (pointer: fine) {
  .project-target:hover .project-star {
    transform: translate(-50%, -50%) scale(1.2);
  }
}
.project-details {
  position: absolute;
  z-index: 2;
  width: min(260px, calc(100% - 24px));
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  background: var(--panel);
  box-shadow: 0 12px 30px #0005;
}
.project-details[hidden] {
  display: none;
}
.project-details h2 {
  margin: 8px 20px 8px 0;
  font-size: 18px;
}
.project-details p {
  margin: 0 0 12px;
  font-size: 14px;
  color: var(--muted);
}
.project-details a {
  font-size: 14px;
}
.eyebrow {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.close-details {
  position: absolute;
  right: 4px;
  top: 4px;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 8px;
  color: var(--muted);
  background: transparent;
  font: 22px system-ui;
  cursor: pointer;
}
a {
  color: inherit;
  text-underline-offset: 3px;
}
a:focus-visible,
.close-details:focus-visible {
  outline: 2px solid var(--text);
  outline-offset: 3px;
}
.map-hint {
  margin: 20px 0 5px;
  font-size: 14px;
}
.map-note,
footer {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
}
footer {
  margin-top: 28px;
}
@media (prefers-color-scheme: light) {
  :root {
    --page: #f6f8fa;
    --text: #171717;
    --muted: #555;
    --star: #171717;
    --panel: #fff;
    --border: #bbb;
  }
}
@media (max-width: 600px) {
  body {
    padding: 20px 16px;
  }
  .project-target {
    left: var(--mx);
    top: var(--my);
  }
}
@media (prefers-reduced-motion: reduce) {
  .project-star {
    transition: none;
  }
}
</style>
    <script>// SPDX-License-Identifier: GPL-3.0-only
"use strict";

document.addEventListener("DOMContentLoaded", () => {
  const projects = JSON.parse(
    document.getElementById("project-data").textContent,
  );
  const scene = document.querySelector(".star-map");
  const targets = Array.from(document.querySelectorAll(".project-target"));
  const details = document.getElementById("project-details");
  const hoverInput = window.matchMedia("(hover: hover) and (pointer: fine)");
  scene.classList.add("interactive-ready");
  let current = null;
  let pinned = false;
  let hoverTimer = null;
  let closeTimer = null;

  function positionDetails() {
    if (current === null || details.hidden) return;
    const anchor = current.getBoundingClientRect();
    const bounds = scene.getBoundingClientRect();
    const x = anchor.left - bounds.left + anchor.width / 2;
    const y = anchor.top - bounds.top + anchor.height / 2;
    const panel = details.getBoundingClientRect();
    const left = Math.min(
      Math.max(12, x - panel.width / 2),
      bounds.width - panel.width - 12,
    );
    let top = y - panel.height - 25;
    if (top < 12) top = y + 25;
    top = Math.min(
      Math.max(12, top),
      Math.max(12, bounds.height - panel.height - 12),
    );
    details.style.left = `${left}px`;
    details.style.top = `${top}px`;
  }

  function clearTimers() {
    window.clearTimeout(hoverTimer);
    window.clearTimeout(closeTimer);
  }

  function showDetails(target) {
    clearTimers();
    const project = projects[Number(target.dataset.project)];
    if (!project) throw new Error("The selected repository is missing.");
    targets.forEach((item) =>
      item.setAttribute("aria-expanded", String(item === target)),
    );
    document.getElementById("project-name").textContent = project.name;
    document.getElementById("project-description").textContent =
      project.description;
    document.getElementById("project-link").href = project.url;
    current = target;
    details.hidden = false;
    positionDetails();
  }

  function hideDetails(restoreFocus = false) {
    clearTimers();
    const previous = current;
    current = null;
    pinned = false;
    details.hidden = true;
    targets.forEach((item) => item.setAttribute("aria-expanded", "false"));
    if (restoreFocus && previous) {
      previous.focus();
      // Focus normally opens details; dismiss again after restoring focus.
      details.hidden = true;
      current = null;
      previous.setAttribute("aria-expanded", "false");
    }
  }

  function scheduleClose() {
    window.clearTimeout(hoverTimer);
    if (pinned) return;
    window.clearTimeout(closeTimer);
    closeTimer = window.setTimeout(() => {
      if (
        details.contains(document.activeElement) ||
        current === document.activeElement
      )
        return;
      hideDetails();
    }, 180);
  }

  targets.forEach((target) => {
    target.addEventListener("pointerenter", () => {
      if (!hoverInput.matches || pinned) return;
      const delay = details.hidden ? 150 : 0;
      clearTimers();
      hoverTimer = window.setTimeout(() => showDetails(target), delay);
    });
    target.addEventListener("pointerleave", scheduleClose);
    target.addEventListener("focus", () => {
      pinned = false;
      showDetails(target);
    });
    target.addEventListener("click", () => {
      if (current === target && pinned) hideDetails();
      else {
        showDetails(target);
        pinned = true;
      }
    });
  });

  details.addEventListener("pointerenter", clearTimers);
  details.addEventListener("pointerleave", scheduleClose);
  scene.addEventListener("focusout", () => {
    window.setTimeout(() => {
      if (!scene.contains(document.activeElement)) hideDetails();
    }, 0);
  });
  document
    .querySelector(".close-details")
    .addEventListener("click", () => hideDetails(true));
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !details.hidden) hideDetails(true);
  });
  document.addEventListener("pointerdown", (event) => {
    if (
      !details.contains(event.target) &&
      !targets.some((target) => target.contains(event.target))
    ) {
      hideDetails();
    }
  });
  window.addEventListener("resize", positionDetails);
});
</script>

          <source

<button class="project-target" data-project="1" style="--x:77.0471%;--y:62.6176%;--mx:55.7436%;--my:68.0147%" aria-label="About CPulse-Tracker" aria-expanded="false" aria-controls="project-details"><span class="project-star" aria-hidden="true"></span><span class="project-fallback" role="tooltip"><strong>CPulse-Tracker</strong><span>Codeforces, CodeChef and LeetCode profiles in one dashboard.</span></span></button>
